<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Курс консоли Linux</title>

    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <link rel="stylesheet" href="style.css" />

    <!-- Yandex.Metrika counter -->

        (function(m, e, t, r, i, k, a) {
            m[i] = m[i] || function() { (m[i].a = m[i].a || []).push(arguments); };
            m[i].l = 1 * new Date();
            for (var j = 0; j < document.scripts.length; j++) {
                if (document.scripts[j].src === r) { return; }
            }
            k = e.createElement(t), a = e.getElementsByTagName(t)[0], k.async = 1, k.src = r, a.parentNode.insertBefore(k, a)
        })(window, document, 'script', 'https://mc.yandex.ru/metrika/tag.js?id=110303584', 'ym');

        ym(110303584, 'init', {
            ssr: true,
            webvisor: true,

    </noscript>
    <!-- /Yandex.Metrika counter -->
</head>

<body>
    <div class="app" id="app">

        <!-- Блок пользователя -->
        <div id="userBlock" class="user-card" style="display: none;">
            <img id="userAvatar" src="" alt="аватар" />
            <span class="user-name" id="userName">Гость</span>
        </div>

        <!-- Вступление в группу -->
        <div id="joinGroupBlock">
            <button class="join-group-button" id="joinGroupButton">📢 Вступить в группу</button>
            <p id="joinGroupStatus" class="join-status"></p>
        </div>

        <!-- Заголовок курса -->
        <div id="courseHeader">
            <h1 id="courseTitle"></h1>
            <h2 id="lessonTitle" style="display: none; font-size: 18px; color: #4a76a8; margin-top: 4px;"></h2>
            <p class="description" id="courseDescription"></p>
            <div id="subscriptionNotice" class="subscription-notice" style="display: none;">
                ⚠️ Видео и тестирование доступны только подписчикам нашей группы.
                <button class="join-group-button-small" id="joinFromNotice">Вступить</button>
            </div>
        </div>

        <!-- Список уроков -->
        <div id="stepsContainer" class="steps-list"></div>

        <!-- Контейнер для видео, статей и тестов -->
        <div id="lessonContainer" style="display: none;">
            <!-- Видео (только плеер, без кнопок) -->
            <div id="videoContainer">
                <div id="videoWrapper"></div>
            </div>

            <!-- Блок статей и общих кнопок управления -->
            <div id="articlesContainer">
                <div id="articleContent" class="article-content"></div>

                <!-- Общий блок управления (кнопки в нужном порядке) -->
                <div class="lesson-actions">
                    <button class="next-article-button" id="nextArticleButton">➡️ Следующая статья</button>
                    <button class="test-button" id="startTestButton">📝 Пройти тестирование</button>
                    <button class="done-button" id="doneButton">✅ Сделано! Перейти к следующему</button>
                    <button class="back-button" id="backButton">← Назад к урокам</button>
                </div>

                <h3 class="articles-header">📚 Статьи урока</h3>
                <div id="articlesList" class="articles-list"></div>
            </div>

            <!-- Блок тестирования -->
            <div id="testContainer" style="display: none;">
                <h3 class="test-header">📝 Тестирование</h3>
                <div id="testProgress" class="test-progress"></div>
                <div id="testQuestion" class="test-question"></div>
                <div id="testOptions" class="test-options"></div>
                <div class="test-actions">
                    <button class="check-button" id="checkButton">Проверить</button>
                    <button class="next-button" id="nextTaskButton" disabled>Следующее задание →</button>
                </div>
                <div class="lesson-actions">
                    <button class="back-button" id="backButton3">← Назад к урокам</button>
                    <button class="done-button" id="doneButton3">✅ Сделано! Перейти к следующему</button>
                </div>
            </div>

            <!-- Блок, если подписка не оформлена -->
            <div id="subscriptionRequired" style="display: none;" class="subscription-required">
                <p>🔒 Для доступа к тестированию необходимо подписаться на наше сообщество.</p>
                <button class="join-group-button" id="joinFromTest">📢 Вступить в группу</button>
                <p class="subscription-hint">Это бесплатно и займёт всего секунду.</p>
                <div class="lesson-actions">
                    <button class="back-button" id="backButton4">← Назад к урокам</button>
                </div>
            </div>
        </div>

        <div class="footer-note">Кликайте на шаг – видео откроется автоматически</div>
        <button class="reset-button" id="resetButton">🔄 Начать обучение сначала</button>
        <div class="version" id="debugToggle">Версия <span id="appVersion"></span></div>
        <div id="debugInfo"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
